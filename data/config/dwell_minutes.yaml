# 유형별 기본 이용시간(분). 실측값이 아닌 가정값이다.
# - 서식4 예시(남은 50분 = 이동 10 + 이용 20 + 복귀 10 + 여유 10)의 이용 20분을 기준 규모로 삼았다.
# - 문화시설은 TourAPI spendtime(관람 소요시간)이 해석되면 그 값을 먼저 쓴다.
# - verified.csv에 dwell_min이 있으면 그 값이 가장 우선한다.
cafe: 25        # 음료 주문·착석
food: 40        # 식사
shopping: 15    # 특산물·기념품 구매
experience: 30  # 체험·레포츠
culture: 30     # 전시·문화시설 (spendtime 없을 때)
sight: 20       # 주변 관광지 둘러보기
