[project]
name = "next-stop-data"
version = "0.1.0"
description = "다음 한 곳: 데이터랩 분석 재현과 TourAPI·TMAP 후보 데이터 파이프라인"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "httpx>=0.27",
  "matplotlib>=3.9",
  "holidays>=0.60",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
